<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <div class="main">
            <h1>RESULT CARD</h1>
            <div class="input-group">
                <label for="english">English:</label>
                <input type="number" id="english" placeholder="English Marks">
                <!-- <button id="eng" class="btn">add</button> -->
            </div>

            <div class="input-group">
                <label for="urdu">Urdu:</label>
                <input type="number" id="urdu" placeholder="Urdu Marks">
                <!-- <button id="urd" class="btn">add</button> -->
            </div>

            <div class="input-group">
                <label for="islamiat">Islamiat:</label>
                <input type="number" id="islamiat" placeholder="Islamiat Marks">
                <!-- <button id="isl" class="btn">add</button> -->
            </div>

            <div class="input-group">
                <label for="math">Math:</label>
                <input type="number" id="math" placeholder="Math Marks">
                <!-- <button id="mth" class="btn">add</button> -->
            </div>

            <div class="input-group">
                <label for="biology">Biology:</label>
                <input type="number" id="biology" placeholder="Biology Marks">
                <!-- <button id="bio" class="btn">add</button> -->
            </div>

            <div class="input-group">
                <label for="physics">Physics:</label>
                <input type="number" id="physics" placeholder="Physics Marks">
            </div>
            <button id="phy" class="btn">Add Numbers</button>
            <div id="result"></div>
        </div>
    </form>

    <script src="app.js"></script>
</body>

</html>
